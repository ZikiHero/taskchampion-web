# deploy_container_github.yml

.build_image: &build_image
  image: quay.io/podman/stable
  tags: [docker]
  before_script:
    - podman login ghcr.io -u "$GITHUB_USERNAME" --password "$GITHUB_TOKEN"

# ─── Backend ────────────────────────────────────────────────────────────────

build_backend_dev:
  <<: *build_image
  stage: build
  script:
    - podman build -f backend/Dockerfile -t ghcr.io/dhufe/tcweb-backend:$CI_COMMIT_SHA ./backend
    - podman save ghcr.io/dhufe/tcweb-backend:$CI_COMMIT_SHA -o backend-image.tar
  artifacts:
    paths:
      - backend-image.tar
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - changes:
        - backend/**/*
        - .gitlab-ci.yml
      when: on_success

deploy_backend_dev:
  <<: *build_image
  stage: release
  needs:
    - job: build_backend_dev
      artifacts: true
  script:
    - podman load -i backend-image.tar
    - podman tag ghcr.io/dhufe/tcweb-backend:$CI_COMMIT_SHA ghcr.io/dhufe/tcweb-backend:dev
    - podman push ghcr.io/dhufe/tcweb-backend:dev
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - changes:
        - backend/**/*
        - .gitlab-ci.yml
      when: on_success

build_backend_release:
  <<: *build_image
  stage: build
  script:
    - podman build -f backend/Dockerfile -t ghcr.io/dhufe/tcweb-backend:$CI_COMMIT_SHA ./backend
    - podman save ghcr.io/dhufe/tcweb-backend:$CI_COMMIT_SHA -o backend-image.tar
  artifacts:
    paths:
      - backend-image.tar
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_TAG'
      changes:
        - backend/**/*
        - .gitlab-ci.yml
      when: on_success

deploy_backend_release:
  <<: *build_image
  stage: release
  needs:
    - job: build_backend_release
      artifacts: true
  script:
    - podman load -i backend-image.tar
    - podman tag ghcr.io/dhufe/tcweb-backend:$CI_COMMIT_SHA ghcr.io/dhufe/tcweb-backend:$CI_COMMIT_TAG
    - podman push ghcr.io/dhufe/tcweb-backend:$CI_COMMIT_TAG
    - podman tag ghcr.io/dhufe/tcweb-backend:$CI_COMMIT_SHA ghcr.io/dhufe/tcweb-backend:latest
    - podman push ghcr.io/dhufe/tcweb-backend:latest
  rules:
    - if: '$CI_COMMIT_TAG'
      changes:
        - backend/**/*
        - .gitlab-ci.yml
      when: on_success

