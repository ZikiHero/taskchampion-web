[package]
name = "taskchampion-service"
version = "0.1.0"
edition = "2024"

[dependencies]
taskchampion = "3.0"
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
